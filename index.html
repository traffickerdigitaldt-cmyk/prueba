<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fersautos · ERP de Mercadeo</title>
<style>
:root{
  --bg:#f5f6fa; --panel:#ffffff; --text:#1c2333; --muted:#7a8496; --border:#e4e7ee;
  --accent:#3b6bc4; --accent-dark:#2c4a78; --danger:#d64545; --ok:#2e9c5c; --warn:#d69a3e;
  --sidebar:#151a26; --sidebar-text:#c6cbd6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1219; --panel:#171c27; --text:#e7eaf1; --muted:#8b93a5; --border:#2a3140;
  }
}
:root[data-theme="dark"]{ --bg:#0f1219; --panel:#171c27; --text:#e7eaf1; --muted:#8b93a5; --border:#2a3140; }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:-apple-system,Segoe UI,Roboto,Inter,Arial,sans-serif;
  background:var(--bg); color:var(--text);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
#app{display:flex; height:100%; overflow:hidden}
aside{
  width:230px; flex-shrink:0; background:var(--sidebar); color:var(--sidebar-text);
  display:flex; flex-direction:column; overflow-y:auto;
}
aside .brand{padding:20px 18px; border-bottom:1px solid #262d3d}
aside .brand b{color:#fff; font-size:16px; display:block}
aside .brand span{font-size:11.5px; color:#8890a3}
nav{flex:1; padding:10px}
nav .grp-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:#5c637a; padding:14px 12px 4px}
nav button{
  width:100%; text-align:left; background:none; border:none; color:var(--sidebar-text);
  padding:10px 12px; border-radius:8px; font-size:13.5px; cursor:pointer; margin-bottom:2px;
  display:flex; align-items:center; gap:10px;
}
nav button:hover{background:#20263a}
nav button.active{background:var(--accent); color:#fff; font-weight:600}
.sync-badge{margin:10px 12px; font-size:11px; padding:6px 10px; border-radius:20px; text-align:center}
.sync-ok{background:#1e3a2a; color:#6fd39a}
.sync-local{background:#3a3220; color:#e0b967}
main{flex:1; overflow-y:auto; padding:26px 30px}
h1{font-size:20px; margin:0 0 4px}
.sub{color:var(--muted); font-size:13px; margin-bottom:20px}
.muted{color:var(--muted); font-weight:400}
.kpis{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px}
.kpi{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 16px; min-width:140px}
.kpi .l{font-size:11px; color:var(--muted); font-weight:600}
.kpi .v{font-size:19px; font-weight:700; margin-top:2px}
.kpi .s{font-size:11px; color:var(--muted); margin-top:3px}
.toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:10px; flex-wrap:wrap}
.btn{border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer}
.btn-primary{background:var(--accent); color:#fff}
.btn-ghost{background:transparent; border:1px solid var(--border); color:var(--text)}
.table-wrap{overflow-x:auto; border-radius:10px; border:1px solid var(--border)}
table{width:100%; border-collapse:collapse; background:var(--panel); min-width:640px}
th,td{padding:10px 12px; font-size:13px; text-align:left; border-bottom:1px solid var(--border); white-space:nowrap}
td.desc{white-space:normal; min-width:200px; max-width:320px; line-height:1.4}
th{font-size:11px; text-transform:uppercase; color:var(--muted); font-weight:700; background:rgba(0,0,0,.02)}
tr:last-child td{border-bottom:none}
tr.total-row td{font-weight:700; background:rgba(0,0,0,.04)}
tr.clickrow{cursor:pointer}
tr.clickrow:hover td{background:rgba(59,107,196,.08)}
.badge{padding:3px 10px; border-radius:20px; font-size:11.5px; font-weight:600; display:inline-block}
.actions{white-space:nowrap}
.actions button{background:none; border:none; cursor:pointer; color:var(--muted); font-size:13px; margin-right:8px}
.actions button:hover{color:var(--accent)}
.empty{padding:30px; text-align:center; color:var(--muted); font-size:13px}
.inl{width:96px; padding:5px 7px; border:1px solid var(--border); border-radius:6px; background:var(--panel); color:var(--text); font-size:13px; font-family:inherit}
.inl:focus{outline:2px solid var(--accent); border-color:transparent}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin:0 0 10px}
.chip{font-size:11.5px; background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:3px 10px; color:var(--muted)}
.chip b{color:var(--text)}
.filters{display:flex; gap:12px; flex-wrap:wrap; align-items:flex-end; margin-bottom:16px}
.fgroup label{display:block; font-size:10.5px; font-weight:700; color:var(--muted); margin-bottom:3px; text-transform:uppercase}
.fgroup select{padding:7px 10px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--text); font-size:13px; font-family:inherit}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px}
.tab{border:1px solid var(--border); background:var(--panel); color:var(--text); padding:7px 14px; border-radius:20px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit}
.tab.on{background:var(--accent); color:#fff; border-color:var(--accent)}
.overlay{position:fixed; inset:0; background:rgba(10,14,22,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px}
.modal{background:var(--panel); border-radius:14px; padding:22px; width:100%; max-width:520px; max-height:90vh; overflow-y:auto}
.modal h2{font-size:15px; margin:0 0 16px}
.field{margin-bottom:12px}
.field label{font-size:11.5px; font-weight:700; color:var(--muted); display:block; margin-bottom:4px}
.field input, .field select, .field textarea{
  width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--border);
  font-size:13.5px; background:var(--panel); color:var(--text); outline:none; font-family:inherit;
}
.field textarea{min-height:60px; resize:vertical}
.hint{font-size:11px; color:var(--muted); margin-top:4px; line-height:1.4}
.modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px}
.report-block{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px}
.report-block h3{font-size:13px; margin:0 0 10px}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:12.5px}
.bar-row .lab{width:170px; flex-shrink:0; color:var(--muted)}
.bar-track{flex:1; height:10px; background:var(--border); border-radius:6px; overflow:hidden}
.bar-fill{height:100%; border-radius:6px}
.bar-row .num{width:46px; text-align:right; font-weight:700}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr)); gap:14px; margin-bottom:14px}
.grid2 .report-block{margin-bottom:0}
.cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; margin-bottom:16px}
.bcard{background:var(--panel); border:1px solid var(--border); border-top:4px solid var(--c); border-radius:12px; padding:14px; cursor:pointer; transition:transform .15s, box-shadow .15s, opacity .15s}
.bcard:hover{transform:translateY(-2px); box-shadow:0 6px 16px rgba(0,0,0,.10)}
.bcard.focus{outline:2px solid var(--c); outline-offset:1px}
.bcard.dim{opacity:.5}
.bcard .top{display:flex; justify-content:space-between; align-items:center; gap:8px}
.bcard .name{font-weight:700; font-size:14px}
.bcard .big{font-size:24px; font-weight:800; margin-top:6px}
.bcard .lbl{font-size:11px; color:var(--muted)}
.bcard .mini{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.7}
.bcard .mini b{color:var(--text)}
.pill{display:inline-block; font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px}
.pill.live{background:#2e9c5c22; color:#2e9c5c; font-size:12px; padding:5px 12px}
.seg{display:inline-flex; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--panel)}
.seg button{border:none; background:none; color:var(--text); padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit}
.seg button.on{background:var(--accent); color:#fff}
.focusbar{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px 14px; font-size:13px; margin-bottom:14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.hrow{display:flex; gap:10px; align-items:center; padding:6px 0; cursor:pointer; border-bottom:1px dashed var(--border); transition:opacity .15s}
.hrow:last-child{border-bottom:none}
.hrow.dim{opacity:.35}
.hlab{width:130px; flex-shrink:0; font-size:12px; font-weight:600; display:flex; align-items:center; gap:6px}
.hlab i{width:9px; height:9px; border-radius:50%; display:inline-block; flex-shrink:0}
.hbars{flex:1; display:flex; flex-direction:column; gap:4px; min-width:0}
.hbar{display:flex; align-items:center; gap:8px}
.htrack{flex:1; height:12px; background:var(--bg); border-radius:6px; display:flex; overflow:hidden}
.hseg{height:100%; transition:width .4s}
.hseg:hover{filter:brightness(1.15)}
.hval{width:76px; font-size:11.5px; font-weight:700; text-align:right; flex-shrink:0}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--muted); margin-bottom:8px}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px}
.alert-row{display:flex; gap:10px; align-items:flex-start; padding:9px 8px; border-bottom:1px solid var(--border); font-size:12.5px; cursor:pointer; border-radius:6px}
.alert-row:hover{background:var(--bg)}
.alert-row:last-child{border-bottom:none}
.dot{width:9px; height:9px; border-radius:50%; margin-top:5px; flex-shrink:0}
#tip{position:fixed; z-index:100; pointer-events:none; background:#111827; color:#fff; font-size:12px; padding:6px 10px; border-radius:8px; max-width:260px; display:none; line-height:1.4}
#toast{position:fixed; bottom:22px; left:50%; transform:translate(-50%,20px); background:#111827; color:#fff; font-size:13px; padding:9px 18px; border-radius:22px; opacity:0; transition:all .25s; z-index:120; pointer-events:none}
#toast.on{opacity:1; transform:translate(-50%,0)}
@media (max-width:760px){
  #app{flex-direction:column}
  aside{width:100%; flex-direction:row; align-items:center; overflow-x:auto; overflow-y:hidden; flex-shrink:0}
  aside .brand{padding:10px 14px; border-bottom:none; border-right:1px solid #262d3d; flex-shrink:0}
  aside .brand span, .sync-badge, nav .grp-label{display:none}
  nav{display:flex; padding:6px; gap:2px; flex:none}
  nav button{white-space:nowrap; width:auto; margin:0; padding:8px 12px}
  main{padding:16px 14px}
  .hlab{width:96px}
}
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="brand"><b>Fersautos</b><span>ERP de mercadeo</span></div>
    <nav id="nav"></nav>
    <div id="syncBadge" class="sync-badge sync-local">Cargando…</div>
  </aside>
  <main><div id="content"></div></main>
</div>
<div id="modalRoot"></div>
<div id="tip"></div>
<div id="toast"></div>

<script>
/* =========================================================
   0. CATÁLOGOS COMPARTIDOS (la marca es el hilo que conecta
      planes, actividades, merchandising y leads)
   ========================================================= */
const MARCAS = ["GWM","JMC","TRUCKS & VANS","SUBARU"];          // marcas principales (siempre visibles)
const MARCAS_EXTRA = ["JAC MOTORS","CITROËN"];                   // aparecen en la hoja de gestión cuando tienen datos
const TODAS_MARCAS = [...MARCAS, ...MARCAS_EXTRA];
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const ESTADOS_ACTIVIDAD = ["Pendiente","En curso","Cumplido","Urgente"];
const ESTADOS_MERCH = ["Pendiente","Pedido","Enviado","Finalizado"];
const ACTIVIDADES_MEDIOS = ["Publicidad digital","Publicidad radio","Publicidad exterior","Prensa / revistas","Evento / activación","Otros"];
const OBJETIVOS = ["Leads","Reconocimiento","Tráfico","Ventas","Otro"];
const MATERIALES_POP = ["OTROS","IMPRESOS","TEXTIL","INFLABLES","VALLAS Y PENDONES","PAPELERÍA"];

// Comparación de marcas tolerante: "Subaru" = "SUBARU", "Trucks&Vans" = "TRUCKS & VANS", "JAC" = "JAC MOTORS"
const keyM = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const MARCA_ALIAS = { JAC:"JACMOTORS", TRUCKSANDVANS:"TRUCKSVANS" };
const sameMarca = (a,b) => { const x = keyM(a), y = keyM(b); return (MARCA_ALIAS[x]||x) === (MARCA_ALIAS[y]||y); };

const sumOf = (list,k) => list.reduce((s,r)=>s+(Number(r[k])||0),0);
const totalMerch = r => (Number(r.cantidad)||0) * (Number(r.valorUnitario)||0);
const money = n => "$ " + Number(n||0).toLocaleString("es-CO", { maximumFractionDigits:0 });
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (a,b) => b>0 ? Math.round(a/b*100) : null;
const pctTxt = v => (v===null || v===undefined) ? "—" : v+"%";
const kpi = (l,v,sub) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div>${sub?`<div class="s">${sub}</div>`:""}</div>`;

function fechaLabel(r){
  const a = r.fechaInicio, b = r.fechaFin;
  if(!a) return "—";
  const d1 = new Date(a+"T00:00:00"), d2 = new Date((b||a)+"T00:00:00");
  if(isNaN(d1) || isNaN(d2)) return "—";
  const m = d => MESES[d.getMonth()];
  if(!b || a===b) return `${d1.getDate()} de ${m(d1)}`;
  if(d1.getMonth()===d2.getMonth() && d1.getFullYear()===d2.getFullYear()) return `${d1.getDate()} al ${d2.getDate()} de ${m(d1)}`;
  return `${d1.getDate()} de ${m(d1)} al ${d2.getDate()} de ${m(d2)}`;
}

/* =========================================================
   1. DEFINICIÓN DE MÓDULOS (config-driven: agregar un módulo
      nuevo, un campo nuevo o un proveedor nuevo solo requiere
      tocar esta sección; todo lo demás se genera solo).
   ========================================================= */
const brandSelect = (extra={}) => ({ key:"marca", label:"Marca", type:"select", optionsFn:()=>brandOptions(), required:true, ...extra });

const MODULES = {
  /* ---------- PLANEACIÓN (réplica de los planes en Excel) ---------- */
  planMedios: {
    label: "Plan de medios", icon: "📺", accent: "#2c4a78", group:"Planeación",
    groupByField:"marca", groupOptions:MARCAS, periodType:"mes",
    statusField:"estado", statusOptions:ESTADOS_ACTIVIDAD,
    footerTotal:true, inlineEdit:true, showTextarea:true,
    singular:"actividad", plural:"actividades", newLabel:"+ Nueva actividad",
    sumFields:["prospectos","objetivoVentas","valor"],
    tableCols:["actividad","descripcion","objetivo","prospectos","objetivoVentas","fecha","valor"],
    computed:[{ key:"fecha", label:"Fecha", fn:r=>fechaLabel(r) }],
    kpiDefs:[
      { label:"Inversión planeada", fn:rs=>money(sumOf(rs,"valor")) },
      { label:"Prospectos meta", fn:rs=>sumOf(rs,"prospectos") },
      { label:"Objetivo de ventas", fn:rs=>sumOf(rs,"objetivoVentas") },
    ],
    fields:[
      brandSelect(),
      { key:"ciudad", label:"Ciudad", type:"text", default:"Cúcuta" },
      { key:"mes", label:"Mes", type:"select", options:MESES, required:true, default:()=>FILTERS.mes || MESES[new Date().getMonth()] },
      { key:"anio", label:"Año", type:"number", default:()=>FILTERS.anio || new Date().getFullYear() },
      { key:"actividad", label:"Actividad", type:"select", options:ACTIVIDADES_MEDIOS, required:true },
      { key:"descripcion", label:"Descripción", type:"textarea", required:true },
      { key:"objetivo", label:"Objetivo", type:"select", options:OBJETIVOS },
      { key:"prospectos", label:"Prospectos", type:"number" },
      { key:"objetivoVentas", label:"Objetivo ventas", type:"number" },
      { key:"fechaInicio", label:"Fecha de inicio", type:"date" },
      { key:"fechaFin", label:"Fecha de fin", type:"date" },
      { key:"valor", label:"Valor", type:"currency" },
      { key:"estado", label:"Estado", type:"select", options:ESTADOS_ACTIVIDAD, default:"Pendiente" },
    ],
  },
  planMerch: {
    label: "Plan de merchandising", icon: "🎽", accent: "#c2570c", group:"Planeación",
    groupByField:"marca", groupOptions:MARCAS, periodType:"mes",
    statusField:"estado", statusOptions:ESTADOS_MERCH,
    footerTotal:true, inlineEdit:true, showTextarea:true,
    singular:"material", plural:"materiales", newLabel:"+ Nuevo material",
    sumFields:["cantidad"],
    tableCols:["material","descripcion","objetivo","cantidad","valorUnitario","valorTotal"],
    computed:[{ key:"valorTotal", label:"Valor total", fn:r=>money(totalMerch(r)), sum:rs=>money(rs.reduce((s,r)=>s+totalMerch(r),0)) }],
    kpiDefs:[
      { label:"Inversión planeada", fn:rs=>money(rs.reduce((s,r)=>s+totalMerch(r),0)) },
      { label:"Unidades planeadas", fn:rs=>sumOf(rs,"cantidad") },
      { label:"Finalizados", fn:rs=>rs.filter(r=>r.estado==="Finalizado").length },
    ],
    fields:[
      brandSelect(),
      { key:"ciudad", label:"Ciudad", type:"text", default:"Cúcuta" },
      { key:"mes", label:"Mes", type:"select", options:MESES, required:true, default:()=>FILTERS.mes || MESES[new Date().getMonth()] },
      { key:"anio", label:"Año", type:"number", default:()=>FILTERS.anio || new Date().getFullYear() },
      { key:"material", label:"Material P.O.P.", type:"select", options:MATERIALES_POP, required:true, default:"OTROS" },
      { key:"descripcion", label:"Descripción", type:"textarea", required:true },
      { key:"objetivo", label:"Objetivo", type:"text" },
      { key:"cantidad", label:"Cantidad", type:"number", required:true },
      { key:"valorUnitario", label:"Valor unitario", type:"currency", hint:"El valor total se calcula solo: cantidad × valor unitario." },
      { key:"estado", label:"Estado", type:"select", options:ESTADOS_MERCH, default:"Pendiente" },
    ],
  },

  /* ---------- ACTIVIDADES (ejecución y bitácora) ---------- */
  Playas: {
    label: "Playas de venta", icon: "🏬", accent: "#3b6bc4", group:"Actividades",
    periodType:"range",
    statusField: "estado", statusOptions: ESTADOS_ACTIVIDAD,
    currencyField: "presupuesto", hasBitacora: true,
    fields: [
      brandSelect(),
      { key:"nombre", label:"Plaza / ubicación", type:"text", required:true },
      { key:"descripcion", label:"Descripción", type:"textarea", required:true },
      { key:"proveedor", label:"Proveedor", type:"dynamicSelect", source:"proveedores" },
      { key:"presupuesto", label:"Presupuesto", type:"currency" },
      { key:"metaProspectos", label:"Meta de prospectos", type:"number" },
      { key:"fechaInicio", label:"Fecha de asignación", type:"date", required:true },
      { key:"fechaFin", label:"Fecha de fin", type:"date", required:true },
      { key:"estado", label:"Estado", type:"select", options:ESTADOS_ACTIVIDAD },
    ],
  },
  pauta: {
    label: "Pauta publicitaria", icon: "📣", accent: "#7a5cc9", group:"Actividades",
    periodType:"range",
    statusField: "estado", statusOptions: ESTADOS_ACTIVIDAD,
    currencyField: "presupuesto", hasBitacora: true,
    fields: [
      brandSelect(),
      { key:"contenido", label:"Contenido a pautar", type:"textarea", required:true },
      { key:"descripcionMarca", label:"Descripción de la marca", type:"textarea" },
      { key:"referencias", label:"Referencias a pautar", type:"textarea" },
      { key:"proveedor", label:"Agencia de pauta", type:"dynamicSelect", source:"proveedores",
        hint:"Regla actual: LeadsYa pauta solo Subaru. Motorleads pauta las demás marcas. Ajusta esto libremente en Proveedores." },
      { key:"presupuesto", label:"Presupuesto", type:"currency" },
      { key:"proyeccionLeads", label:"Proyección de leads", type:"number" },
      { key:"fechaInicio", label:"Fecha de inicio", type:"date", required:true },
      { key:"fechaFin", label:"Fecha de fin", type:"date", required:true },
      { key:"estado", label:"Estado", type:"select", options:ESTADOS_ACTIVIDAD },
    ],
  },
  exhibiciones: {
    label: "Exhibición en CC", icon: "🏢", accent: "#2e9c5c", group:"Actividades",
    periodType:"range",
    statusField: "estado", statusOptions: ESTADOS_ACTIVIDAD,
    currencyField: "presupuesto", hasBitacora: true,
    fields: [
      brandSelect(),
      { key:"centroComercial", label:"Centro comercial", type:"text", required:true },
      { key:"descripcion", label:"Descripción", type:"textarea" },
      { key:"proveedor", label:"Proveedor", type:"dynamicSelect", source:"proveedores" },
      { key:"presupuesto", label:"Presupuesto", type:"currency" },
      { key:"metaProspectos", label:"Meta de prospectos", type:"number" },
      { key:"fechaInicio", label:"Fecha de inicio", type:"date", required:true },
      { key:"fechaFin", label:"Fecha de fin", type:"date", required:true },
      { key:"estado", label:"Estado", type:"select", options:ESTADOS_ACTIVIDAD },
    ],
  },
  merchandising: {
    label: "Pedidos de merchandising", icon: "🎁", accent: "#c2570c", group:"Actividades",
    reportType:"pedidos",
    groupByField: "marca", groupOptions: MARCAS,
    sumFields: ["presupuestoAprobado","total","pendiente","pedido","enviado","finalizado"],

/* =========================================================
   2. CAPA DE DATOS: intenta la base compartida (db); si no
      está disponible, usa localStorage sin romper la app.
   ========================================================= */
let db = null, DL = null;
let sharedMode = false;
const DATA = {};
Object.keys(MODULES).forEach(k => DATA[k] = []);
const FILTERS = { marca:"", mes:"", anio:"" };   // filtros globales: se mantienen al cambiar de módulo

async function initStore(){
  try{ db = await claude.use("db"); }catch(e){ db = null; }
  try{ DL = await claude.use("downloads"); }catch(e){ DL = null; }
  sharedMode = !!db;
  const badge = document.getElementById("syncBadge");
  badge.className = "sync-badge " + (sharedMode ? "sync-ok" : "sync-local");
  badge.textContent = sharedMode ? "● Datos compartidos · en vivo" : "● Guardado en este navegador";
  for(const key of Object.keys(MODULES)) await loadModule(key);

  // Semilla inicial de proveedores (editable/eliminable luego)
  if(!DATA.proveedores.length){
    await saveRecord("proveedores", { nombre:"LeadsYa", tipo:"Agencia de pauta", marcasAtendidas:"Subaru", contacto:"", telefono:"", notas:"Pauta exclusiva Subaru.", estado:"Activo" });
    await saveRecord("proveedores", { nombre:"Motorleads", tipo:"Agencia de pauta", marcasAtendidas:"Todas excepto Subaru", contacto:"", telefono:"", notas:"Pauta el resto de marcas.", estado:"Activo" });
  }
}

async function loadModule(key){
  if(sharedMode){
    try{
      const snap = await db.collection(key).get();
      DATA[key] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      return;
    }catch(e){ console.error("Error leyendo "+key, e); }
  }
  try{
    const raw = localStorage.getItem("fersautos_"+key);
    DATA[key] = raw ? JSON.parse(raw) : [];
  }catch(e){ DATA[key] = []; }
}

function persistLocal(key){
  try{ localStorage.setItem("fersautos_"+key, JSON.stringify(DATA[key])); }catch(e){}
}

async function saveRecord(key, record){
  const isNew = !record.id;
  if(sharedMode){
    try{
      if(!isNew){
        const { id, ...rest } = record;
        await db.collection(key).doc(id).set(rest);
      }else{
        const ref = await db.collection(key).add(record);
        record.id = ref.id;
      }
    }catch(e){ alert("No se pudo guardar en la base compartida. Se guardó localmente."); sharedMode=false; }
  }
  const idx = DATA[key].findIndex(r => r.id === record.id);
  if(idx >= 0) DATA[key][idx] = record; else { record.id = record.id || ("l"+Date.now()+Math.random().toString(36).slice(2,6)); DATA[key].push(record); }
  if(!sharedMode) persistLocal(key);
  toast("Guardado ✓");
}

async function deleteRecord(key, id){
  if(sharedMode){
    try{ await db.collection(key).doc(id).delete(); }catch(e){}
  }
  DATA[key] = DATA[key].filter(r => r.id !== id);
  if(!sharedMode) persistLocal(key);
  toast("Eliminado");
}

/* =========================================================
   3. MARCAS, PERÍODOS Y FILTROS (el "pegamento" entre módulos)
   ========================================================= */
const badge = (text) => {
  const c = STATUS_COLORS[text] || "#7a8496";
  return `<span class="badge" style="background:${c}22;color:${c}">${text}</span>`;
};
function bitTotals(r){
  const b = r.bitacora || [];
  return { dias:b.length, prospectos:b.reduce((s,e)=>s+(Number(e.prospectos)||0),0), ventas:b.reduce((s,e)=>s+(Number(e.ventas)||0),0) };
}

const brandFieldOf = mod => (mod && mod.brandField !== undefined) ? mod.brandField : ((mod && mod.fields.some(f=>f.key==="marca")) ? "marca" : null);

// Todas las marcas seleccionables: las oficiales + cualquier otra que ya exista en los datos
function brandOptions(){
  const list = [...TODAS_MARCAS];
  Object.entries(MODULES).forEach(([k,m])=>{
    const bf = brandFieldOf(m);
    if(bf) (DATA[k]||[]).forEach(r=>{ const v=r[bf]; if(v && !list.some(o=>sameMarca(o,v))) list.push(v); });
  });
  return list;
}
// Marcas que se muestran en la hoja de gestión: las 4 principales + las que tengan datos
function brandsWithData(){
  const list = [...MARCAS];
  Object.entries(MODULES).forEach(([k,m])=>{
    const bf = brandFieldOf(m);
    if(bf) (DATA[k]||[]).forEach(r=>{
      const v = r[bf];
      if(v && !list.some(o=>sameMarca(o,v))) list.push(TODAS_MARCAS.find(o=>sameMarca(o,v)) || v);
    });
  });
  return list;
}
function yearOptions(){
  const ys = new Set([new Date().getFullYear()]);
  ["planMedios","planMerch"].forEach(k=>(DATA[k]||[]).forEach(r=>{ if(r.anio) ys.add(Number(r.anio)); }));
  ["Playas","pauta","exhibiciones"].forEach(k=>(DATA[k]||[]).forEach(r=>[r.fechaInicio,r.fechaFin].forEach(d=>{ if(d) ys.add(Number(String(d).slice(0,4))); })));
  return [...ys].filter(Boolean).sort();
}

function matchPeriod(mod, r){
  const mes = FILTERS.mes, anio = FILTERS.anio;
  if(!mes && !anio) return true;
  if(mod.periodType === "mes"){
    if(mes && r.mes !== mes) return false;
    if(anio && String(r.anio) !== String(anio)) return false;
    return true;
  }
  if(mod.periodType === "range"){
    const a = r.fechaInicio, b = r.fechaFin || r.fechaInicio;
    if(!a) return true;
    const s = new Date(a+"T00:00:00"), e = new Date(b+"T00:00:00");
    if(isNaN(s) || isNaN(e)) return true;
    const m = mes ? MESES.indexOf(mes) : null;
    const y = anio ? Number(anio) : null;
    if(y !== null){
      const ws = new Date(y, m!==null ? m : 0, 1);
      const we = m!==null ? new Date(y, m+1, 0) : new Date(y, 11, 31);
      return s <= we && e >= ws;
    }
    // solo mes (cualquier año): algún mes del rango debe coincidir
    const cur = new Date(s.getFullYear(), s.getMonth(), 1);
    while(cur <= e){ if(cur.getMonth() === m) return true; cur.setMonth(cur.getMonth()+1); }
    return false;
  }
  return true;
}

// Registros de un módulo filtrados por marca (opcional) y por el período activo
function rowsFor(key, brand){
  const mod = MODULES[key], bf = brandFieldOf(mod);
  return (DATA[key]||[]).filter(r => (!brand || !bf || sameMarca(r[bf], brand)) && matchPeriod(mod, r));
}
const viewRows = key => rowsFor(key, FILTERS.marca);

function filterBar(mod, opts){
  opts = opts || {};
  const bf = opts.noBrand ? null : brandFieldOf(mod);
  const hasPeriod = !!opts.period || !!(mod && mod.periodType);
  if(!bf && !hasPeriod) return "";
  let h = `<div class="filters">`;
  if(bf){
    h += `<div class="fgroup"><label>Marca</label><select data-filter="marca"><option value="">Todas</option>${brandOptions().map(b=>`<option ${b===FILTERS.marca?"selected":""}>${esc(b)}</option>`).join("")}</select></div>`;
  }
  if(hasPeriod){
    h += `<div class="fgroup"><label>Mes</label><select data-filter="mes"><option value="">Todos</option>${MESES.map(m=>`<option ${m===FILTERS.mes?"selected":""}>${m}</option>`).join("")}</select></div>`;
    h += `<div class="fgroup"><label>Año</label><select data-filter="anio"><option value="">Todos</option>${yearOptions().map(y=>`<option ${String(y)===String(FILTERS.anio)?"selected":""}>${y}</option>`).join("")}</select></div>`;
  }
  if(FILTERS.marca || FILTERS.mes || FILTERS.anio) h += `<button class="btn btn-ghost" data-clear="1">Limpiar filtros</button>`;
  return h + `</div>`;
}

/* =========================================================
   4. NAVEGACIÓN (agrupada por categoría)
   ========================================================= */
let activeModule = "dashboard";

function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  const items = [
    ["dashboard", { label:"Dashboard en vivo", icon:"📡", group:"Panel" }],
    ["gestion", { label:"Gestión por marca", icon:"🧭", group:"Panel" }],
    ...Object.entries(MODULES),
    ["reportes", { label:"Reportes", icon:"📊", group:"Control" }],
  ];
  let lastGroup = null;
  items.forEach(([key, mod]) => {
    if(mod.group && mod.group !== lastGroup){
      const g = document.createElement("div");
      g.className = "grp-label"; g.textContent = mod.group;
      nav.appendChild(g); lastGroup = mod.group;
    }
    const b = document.createElement("button");
    b.textContent = mod.icon + "  " + mod.label;
    b.className = key === activeModule ? "active" : "";
    b.onclick = () => { activeModule = key; render(); };
    nav.appendChild(b);
  });
}

function render(){
  const m = document.querySelector("main");
  const st = m ? m.scrollTop : 0;
  renderNav();
  const content = document.getElementById("content");
  content.innerHTML = activeModule === "reportes" ? renderReportes()
                    : activeModule === "dashboard" ? renderDashboard()
                    : activeModule === "gestion" ? renderGestion()
                    : renderModuleView(activeModule);
  wireModuleEvents();
  if(m) m.scrollTop = st;
}

/* =========================================================
   5. VISTA GENÉRICA DE MÓDULO (tabla + KPIs + columnas
      calculadas: bitácora diaria y/o "computed" del módulo)
   ========================================================= */
function renderModuleView(key){
  const mod = MODULES[key];
  const rows = viewRows(key);
  if(mod.groupByField) return renderGroupedView(key, mod, rows);

  const total = rows.length;
  const kpis = [kpi("Registros", total)];
  if(mod.currencyField){
    const sum = rows.reduce((s,r)=>s+(Number(r[mod.currencyField])||0),0);
    kpis.push(kpi(`${mod.fields.find(f=>f.key===mod.currencyField).label} (total)`, money(sum)));
  }
  if(mod.hasBitacora){
    const tp = rows.reduce((s,r)=>s+bitTotals(r).prospectos,0);
    const tv = rows.reduce((s,r)=>s+bitTotals(r).ventas,0);
    kpis.push(kpi("Prospectos totales", tp));
    kpis.push(kpi("Ventas totales", tv));
  }
  mod.statusOptions.slice(0,3).forEach(s=>{
    const c = rows.filter(r=>r[mod.statusField]===s).length;
    kpis.push(kpi(s, c));
  });

  const cols = mod.fields.filter(f=>f.type!=="textarea").slice(0,6);
  const extraHeads = [], extraFns = [];
  if(mod.hasBitacora){ extraHeads.push("Prospectos","Ventas"); extraFns.push(r=>bitTotals(r).prospectos, r=>bitTotals(r).ventas); }
  if(mod.computed){ mod.computed.forEach(c=>{ extraHeads.push(c.label); extraFns.push(c.fn); }); }

  const head = cols.map(f=>`<th>${f.label}</th>`).join("") + extraHeads.map(h=>`<th>${h}</th>`).join("") + "<th>Estado</th><th></th>";
  const body = rows.length ? rows.map(r => `
    <tr>
      ${cols.map(f=>`<td>${f.type==="currency"?money(r[f.key]):(esc(r[f.key])||"—")}</td>`).join("")}
      ${extraFns.map(fn=>`<td>${fn(r)}</td>`).join("")}
      <td>
        <select data-role="status" data-id="${r.id}" style="border:none;background:${(STATUS_COLORS[r[mod.statusField]]||"#7a8496")}22;color:${STATUS_COLORS[r[mod.statusField]]||"#7a8496"};font-weight:600;border-radius:20px;padding:3px 8px;font-size:11.5px">
          ${mod.statusOptions.map(s=>`<option ${s===r[mod.statusField]?"selected":""}>${s}</option>`).join("")}
        </select>
      </td>
      <td class="actions">
        ${mod.hasBitacora?`<button data-role="bitacora" data-id="${r.id}" title="Bitácora diaria">📅</button>`:""}
        <button data-role="edit" data-id="${r.id}" title="Editar">✎</button>
        <button data-role="del" data-id="${r.id}" title="Eliminar">🗑</button>
      </td>
    </tr>`).join("") : `<tr><td colspan="${cols.length+extraHeads.length+2}" class="empty">${(FILTERS.marca||FILTERS.mes||FILTERS.anio) ? "No hay registros con estos filtros." : 'Aún no hay registros. Crea el primero con "+ Nuevo".'}</td></tr>`;

  return `
    <h1>${mod.icon} ${mod.label}</h1>
    <div class="sub">Gestión de ${mod.label.toLowerCase()} — Fersautos.</div>
    ${filterBar(mod)}
    <div class="kpis">${kpis.join("")}</div>
    <div class="toolbar">
      <div></div>
      <button class="btn btn-primary" data-role="new">+ Nuevo registro</button>
    </div>
    <div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
  `;
}

// Grupos (una sección por marca): las definidas + cualquier marca extra presente en los datos
function groupsFor(mod, rows){
  const extra = [];
  rows.forEach(r=>{
    const v = r[mod.groupByField];
    if(v && !mod.groupOptions.some(o=>sameMarca(o,v)) && !extra.some(o=>sameMarca(o,v))) extra.push(TODAS_MARCAS.find(o=>sameMarca(o,v)) || v);
  });
  return [...mod.groupOptions, ...extra];
}

// Columnas de una vista agrupada: tableCols (si existe) o todos los campos + columnas calculadas
function buildColumns(mod){
  const gf = mod.groupByField;
  if(mod.tableCols){
    return mod.tableCols.map(k=>{
      const f = mod.fields.find(x=>x.key===k);
      if(f) return { kind:"f", f, label:f.label };
      const c = (mod.computed||[]).find(x=>x.key===k);
      return { kind:"c", c, label:c.label };
    });
  }
  const cols = mod.fields.filter(f=>f.key!==gf && (mod.showTextarea || f.type!=="textarea")).map(f=>({ kind:"f", f, label:f.label }));
  const comp = (mod.computed||[]).map(c=>({ kind:"c", c, label:c.label }));
  return [...cols, ...comp];
}

/* Vista agrupada por marca (Pedidos de merchandising y los planes):
   una sección por marca, con totales. Las cifras se editan directo en la tabla. */
function renderGroupedView(key, mod, rows){
  const gf = mod.groupByField;
  const footer = !!mod.footerTotal;
  const multi = !!mod.sumFields && !footer;
  const sumKeys = mod.sumFields || (mod.sumField ? [mod.sumField] : []);
  const fieldOf = k => mod.fields.find(f=>f.key===k);
  const fmt = (k,n) => fieldOf(k).type==="currency" ? money(n) : n;

  let groups = groupsFor(mod, rows);
  if(FILTERS.marca){
    groups = groups.filter(g=>sameMarca(g, FILTERS.marca));
    if(!groups.length) groups = [FILTERS.marca];
  }

  let kpis;
  if(mod.kpiDefs){
    kpis = [kpi("Registros", rows.length), ...mod.kpiDefs.map(d=>kpi(d.label, d.fn(rows)))];
  }else{
    kpis = [kpi(multi ? "Pedidos" : "Referencias", rows.length)];
    sumKeys.forEach(k=> kpis.push(kpi(fieldOf(k).label + (multi ? "" : " total"), fmt(k, sumOf(rows,k)))));
    if(!multi && mod.sumField){
      groups.forEach(g=> kpis.push(kpi(g, sumOf(rows.filter(r=>sameMarca(r[gf],g)), mod.sumField))));
    }
  }

  const columns = buildColumns(mod);
  const hasStatus = !!mod.statusField;
  const periodTxt = mod.periodType ? " " + [FILTERS.mes, FILTERS.anio].filter(Boolean).join(" ") : "";

  const cell = (f, r) => {
    if(mod.inlineEdit && (f.type==="number" || f.type==="currency")){
      return `<td><input class="inl" type="number" min="0" step="any" data-role="inline" data-id="${r.id}" data-key="${f.key}" value="${Number(r[f.key])||0}"></td>`;
    }
    if(f.type==="textarea") return `<td class="desc">${r[f.key] ? esc(r[f.key]) : "—"}</td>`;
    return `<td>${f.type==="currency"?money(r[f.key]):(esc(r[f.key])||"—")}</td>`;
  };
  const colCell = (c, r) => c.kind==="c" ? `<td>${c.c.fn(r)}</td>` : cell(c.f, r);

  const footRow = rs => {
    const cells = columns.map((c,i)=>{
      let v = "";
      if(i===0) v = "TOTAL";
      else if(c.kind==="f" && sumKeys.includes(c.f.key)) v = fmt(c.f.key, sumOf(rs, c.f.key));
      else if(c.kind==="c" && c.c.sum) v = c.c.sum(rs);
      return `<td>${v}</td>`;
    }).join("");
    return `<tr class="total-row">${cells}${hasStatus?"<td></td>":""}<td></td></tr>`;
  };

  const groupsHTML = groups.map(g=>{
    const groupRows = rows.filter(r=>sameMarca(r[gf], g));
    const head = columns.map(c=>`<th>${c.label}</th>`).join("") + (hasStatus ? "<th>Estado</th>" : "") + "<th></th>";
    const colspan = columns.length + (hasStatus?1:0) + 1;
    const body = groupRows.length ? groupRows.map(r => `
      <tr>
        ${columns.map(c=>colCell(c,r)).join("")}
        ${hasStatus ? `<td>
          <select data-role="status" data-id="${r.id}" style="border:none;background:${(STATUS_COLORS[r[mod.statusField]]||"#7a8496")}22;color:${STATUS_COLORS[r[mod.statusField]]||"#7a8496"};font-weight:600;border-radius:20px;padding:3px 8px;font-size:11.5px">
            ${mod.statusOptions.map(s=>`<option ${s===r[mod.statusField]?"selected":""}>${s}</option>`).join("")}
          </select>
        </td>` : ""}
        <td class="actions">
          <button data-role="edit" data-id="${r.id}" title="Editar">✎</button>
          <button data-role="del" data-id="${r.id}" title="Eliminar">🗑</button>
        </td>
      </tr>`).join("") + (footer ? footRow(groupRows) : "")
      : `<tr><td colspan="${colspan}" class="empty">Sin ${mod.plural || "registros"} en ${esc(g)}${periodTxt ? " ("+periodTxt.trim()+")" : ""}.</td></tr>`;

    let title, chips = "";
    if(footer){
      title = `${mod.label}${periodTxt} — ${esc(g)} <span class="muted">· ${groupRows.length} ${groupRows.length===1 ? mod.singular : mod.plural}</span>`;
    }else if(multi){
      title = `${esc(g)} — ${groupRows.length} ${groupRows.length===1 ? "pedido" : "pedidos"}`;
      chips = `<div class="chips">` + sumKeys.map(k=>`<span class="chip">${fieldOf(k).label}: <b>${fmt(k,sumOf(groupRows,k))}</b></span>`).join("") + `</div>`;
    }else{
      title = `${esc(g)} — ${sumOf(groupRows, mod.sumField)} ${fieldOf(mod.sumField).label.toLowerCase()}`;
    }
    return `
      <div class="report-block">
        <h3>${title}</h3>
        ${chips}
        <div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
      </div>`;
  }).join("");

  return `
    <h1>${mod.icon} ${mod.label}</h1>
    <div class="sub">Gestión de ${mod.label.toLowerCase()} por marca — Fersautos.${mod.inlineEdit ? " Edita las cifras directamente en la tabla; la descripción y demás datos, desde ✎." : ""}</div>
    ${filterBar(mod)}
    <div class="kpis">${kpis.join("")}</div>
    <div class="toolbar">
      <div></div>
      <button class="btn btn-primary" data-role="new">${mod.newLabel || "+ Nuevo registro"}</button>
    </div>
    ${groupsHTML}
  `;
}

function wireModuleEvents(){
  const key = activeModule;
  const root = document.getElementById("content");

  // Filtros globales y pestañas de marca
  root.querySelectorAll('[data-filter]').forEach(sel=>{
    sel.onchange = () => { FILTERS[sel.dataset.filter] = sel.value; render(); };
  });
  root.querySelectorAll('[data-clear]').forEach(b=>{
    b.onclick = () => { FILTERS.marca = ""; FILTERS.mes = ""; FILTERS.anio = ""; render(); };
  });
  root.querySelectorAll('[data-brandtab]').forEach(el=>{
    el.onclick = () => { FILTERS.marca = el.dataset.brandtab; render(); };
  });
  const exp = root.querySelector('[data-role="export"]');
  if(exp) exp.onclick = exportGestion;

  // Dashboard interactivo
  root.querySelectorAll('[data-metric]').forEach(b=>{ b.onclick = () => { DASH.metric = b.dataset.metric; render(); }; });
  root.querySelectorAll('[data-cum]').forEach(b=>{ b.onclick = () => { DASH.cum = b.dataset.cum === "1"; render(); }; });
  root.querySelectorAll('[data-focus]').forEach(el=>{
    el.onclick = () => {
      const v = el.dataset.focus;
      FILTERS.marca = (v && FILTERS.marca && sameMarca(FILTERS.marca, v)) ? "" : v;
      render();
    };
  });
  root.querySelectorAll('[data-goto]').forEach(el=>{
    el.onclick = (e) => {
      e.stopPropagation();
      if(el.dataset.marca !== undefined) FILTERS.marca = el.dataset.marca;
      activeModule = el.dataset.goto; render();
    };
  });

  if(key === "reportes" || key === "gestion" || key === "dashboard") return;

  const btnNew = root.querySelector('[data-role="new"]');
  if(btnNew) btnNew.onclick = () => openForm(key, null);
  root.querySelectorAll('[data-role="edit"]').forEach(b=>{
    b.onclick = () => openForm(key, DATA[key].find(r=>r.id===b.dataset.id));
  });
  root.querySelectorAll('[data-role="del"]').forEach(b=>{
    b.onclick = async () => {
      if(confirm("¿Eliminar este registro? Esta acción no se puede deshacer.")){
        await deleteRecord(key, b.dataset.id);
        render();
      }
    };
  });
  root.querySelectorAll('[data-role="bitacora"]').forEach(b=>{
    b.onclick = () => openBitacora(key, DATA[key].find(r=>r.id===b.dataset.id));
  });
  root.querySelectorAll('[data-role="status"]').forEach(sel=>{
    sel.onchange = async () => {
      const rec = DATA[key].find(r=>r.id===sel.dataset.id);
      rec[MODULES[key].statusField] = sel.value;
      await saveRecord(key, rec);
      render();
    };
  });
  // Edición directa de cifras en la tabla (planes y pedidos)
  root.querySelectorAll('[data-role="inline"]').forEach(inp=>{
    inp.onchange = async () => {
      const rec = DATA[key].find(r=>r.id===inp.dataset.id);
      if(!rec) return;
      rec[inp.dataset.key] = Math.max(0, Number(inp.value) || 0);
      await saveRecord(key, rec);
      render();
    };
  });
}

/* =========================================================
   6. FORMULARIO MODAL (genérico, a partir de la config)
   ========================================================= */
function openForm(key, record){
  const mod = MODULES[key];
  const isEdit = !!record;
  const data = record ? { ...record } : {};
  if(!isEdit){
    mod.fields.forEach(f=>{
      if(f.default !== undefined && data[f.key] === undefined) data[f.key] = typeof f.default === "function" ? f.default() : f.default;
    });
    const bf = brandFieldOf(mod);
    if(bf && FILTERS.marca && data[bf] === undefined) data[bf] = FILTERS.marca;   // hereda la marca filtrada
  }
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="overlay" id="overlay">
      <div class="modal">
        <h2>${isEdit ? "Editar" : "Nuevo"} registro — ${mod.label}</h2>
        <form id="recForm">
          ${mod.fields.map(f => fieldHTML(f, data[f.key])).join("")}
          <div class="modal-actions">
            <button type="button" class="btn btn-ghost" id="cancelBtn">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>`;
  document.getElementById("cancelBtn").onclick = () => root.innerHTML = "";
  document.getElementById("overlay").onclick = (e) => { if(e.target.id==="overlay") root.innerHTML=""; };
  document.getElementById("recForm").onsubmit = async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const rec = isEdit ? { ...record } : {};
    const autoBlank = [];
    mod.fields.forEach(f => {
      let v = fd.get(f.key) || "";
      if(f.auto && v === "") autoBlank.push(f);
      if(f.type === "currency" || f.type === "number") v = Number(v) || 0;
      rec[f.key] = v;
    });
    autoBlank.forEach(f => { rec[f.key] = f.auto(rec); });   // campos que se calculan solos si se dejan vacíos
    await saveRecord(key, rec);
    root.innerHTML = "";
    render();
  };
}

function fieldHTML(f, value){
  const val = value !== undefined ? value : "";
  const req = f.required ? "required" : "";
  const hintHTML = f.hint ? `<div class="hint">${f.hint}</div>` : "";
  if(f.type === "select" || f.type === "dynamicSelect"){
    let opts = f.type === "dynamicSelect" ? (DATA[f.source]||[]).map(r=>r.nombre).filter(Boolean) : (f.optionsFn ? f.optionsFn() : f.options);
    opts = [...opts];
    if(val && !opts.includes(val)) opts.push(val);   // conserva valores antiguos que no estén en la lista
    return `<div class="field"><label>${f.label}</label><select name="${f.key}" ${req}>
      <option value="">— Selecciona —</option>
      ${opts.map(o=>`<option ${o===val?"selected":""}>${esc(o)}</option>`).join("")}
    </select>${hintHTML}</div>`;
  }
  if(f.type === "textarea"){
    return `<div class="field"><label>${f.label}</label><textarea name="${f.key}" ${req}>${esc(val)}</textarea>${hintHTML}</div>`;
  }
  const inputType = f.type === "currency" ? "number" : (f.type === "date" ? "date" : (f.type === "number" ? "number" : "text"));
  const extra = (f.type === "currency" || f.type === "number") ? 'min="0" step="any"' : "";
  return `<div class="field"><label>${f.label}</label><input type="${inputType}" name="${f.key}" value="${esc(val)}" ${extra} ${req}>${hintHTML}</div>`;
}

/* =========================================================
   7. BITÁCORA DIARIA (día a día) + CONSOLIDADO
      Se usa en Playas de venta, Pauta publicitaria y
      Exhibiciones. Queda ligada al registro (record.bitacora).
   ========================================================= */
function openBitacora(key, record){
  const root = document.getElementById("modalRoot");
  const draw = () => {
    const entries = (record.bitacora||[]).slice().sort((a,b)=> (a.fecha||"") < (b.fecha||"") ? -1 : 1);
    const t = bitTotals(record);
    const titulo = record.nombre || record.centroComercial || record.marca || "";
    root.innerHTML = `
      <div class="overlay" id="ovBit">
        <div class="modal" style="max-width:580px">
          <h2>📅 Bitácora diaria — ${esc(record.marca||"")} ${esc(titulo)}</h2>
          <div class="sub" style="margin-bottom:10px">Vigencia: ${record.fechaInicio||"—"} a ${record.fechaFin||"—"}</div>
          <form id="bitForm" style="display:flex;gap:8px;align-items:end;margin-bottom:14px;flex-wrap:wrap">
            <div class="field" style="flex:1;min-width:130px;margin-bottom:0"><label>Fecha</label>
              <input type="date" name="fecha" required min="${record.fechaInicio||''}" max="${record.fechaFin||''}" value="${record.fechaInicio||''}"></div>
            <div class="field" style="flex:1;min-width:90px;margin-bottom:0"><label>Prospectos</label><input type="number" name="prospectos" min="0" value="0"></div>
            <div class="field" style="flex:1;min-width:90px;margin-bottom:0"><label>Ventas</label><input type="number" name="ventas" min="0" value="0"></div>
            <button class="btn btn-primary" type="submit" style="height:37px">+ Agregar día</button>
          </form>
          <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Prospectos</th><th>Ventas</th><th></th></tr></thead>
          <tbody>${entries.length ? entries.map(e=>`
            <tr><td>${e.fecha}</td><td>${e.prospectos}</td><td>${e.ventas}</td>
            <td class="actions"><button data-del="${e.id}" title="Eliminar">🗑</button></td></tr>`).join("")
            : `<tr><td colspan="4" class="empty">Sin registros diarios aún.</td></tr>`}
          </tbody></table></div>
          <div class="report-block" style="margin-top:14px">
            <h3>Consolidado de la actividad</h3>
            <div class="kpis" style="margin-bottom:0">
              ${kpi("Días registrados", t.dias)}
              ${kpi("Prospectos totales", t.prospectos)}
              ${kpi("Ventas totales", t.ventas)}
              ${kpi("Conversión", (t.prospectos ? Math.round((t.ventas/t.prospectos)*100) : 0) + "%")}
            </div>
          </div>
          <div class="modal-actions"><button class="btn btn-ghost" id="closeBit">Cerrar</button></div>
        </div>
      </div>`;
    document.getElementById("closeBit").onclick = () => { root.innerHTML=""; render(); };
    document.getElementById("ovBit").onclick = (e) => { if(e.target.id==="ovBit"){ root.innerHTML=""; render(); } };
    document.getElementById("bitForm").onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      record.bitacora = record.bitacora || [];
      record.bitacora.push({ id:"b"+Date.now()+Math.random().toString(36).slice(2,5), fecha: fd.get("fecha"), prospectos:Number(fd.get("prospectos"))||0, ventas:Number(fd.get("ventas"))||0 });
      await saveRecord(key, record);
      draw();
    };
    root.querySelectorAll("[data-del]").forEach(b=>{
      b.onclick = async () => {
        record.bitacora = (record.bitacora||[]).filter(x=>x.id!==b.dataset.del);

        draw();
      };

  draw();
}

/* =========================================================
   7b. DASHBOARD EN VIVO (interactivo, por marca)
   ========================================================= */
const DASH = { metric:"inversion", cum:false };
let LAST_SYNC = null, READY = false, renderTimer = null;

const BRAND_PALETTE = ["#3b6bc4","#d64545","#d69a3e","#2e9c5c","#7a5cc9","#8a5a16","#0e8f9a","#c2570c"];
const BRAND_COLORS = { "GWM":"#3b6bc4", "JMC":"#d64545", "TRUCKS & VANS":"#d69a3e", "SUBARU":"#2e9c5c", "JAC MOTORS":"#7a5cc9", "CITROËN":"#c2570c" };
function brandColor(b){
  const k = TODAS_MARCAS.find(o=>sameMarca(o,b));
  if(k) return BRAND_COLORS[k];
  let h = 0; for(const c of String(b)) h = (h*31 + c.charCodeAt(0)) % BRAND_PALETTE.length;
  return BRAND_PALETTE[h];
}
const moneyShort = n => {
  n = Number(n)||0;
  if(Math.abs(n) >= 1e6) return "$ " + (n/1e6).toLocaleString("es-CO",{maximumFractionDigits:1}) + " M";
  if(Math.abs(n) >= 1e3) return "$ " + Math.round(n/1e3).toLocaleString("es-CO") + " mil";
  return "$ " + n;
};
const isoToday = () => { const d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const fechaCorta = f => { const d = new Date(f+"T00:00:00"); return isNaN(d) ? f : d.getDate()+" "+MESES[d.getMonth()].slice(0,3); };

function toast(msg){
  if(!READY) return;
  const t = document.getElementById("toast"); if(!t) return;
  t.textContent = msg; t.classList.add("on");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("on"), 1800);
}

/* ---- Tiempo real: cada colección se escucha y la pantalla se refresca sola ---- */
function liveLabel(){
  if(!sharedMode) return "○ Sin conexión en vivo · datos de este navegador";
  const t = (LAST_SYNC || new Date()).toLocaleTimeString("es-CO", { hour:"2-digit", minute:"2-digit", second:"2-digit" });
  return "● En vivo · actualizado " + t;
}
function touchLive(){
  LAST_SYNC = new Date();
  const el = document.getElementById("livePill"); if(el) el.textContent = liveLabel();
}
function scheduleRender(){
  clearTimeout(renderTimer);
  const attempt = () => {
    const ae = document.activeElement;
    const typing = ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName) && document.getElementById("content").contains(ae);
    const modal = document.getElementById("modalRoot").innerHTML.trim() !== "";
    if(typing || modal){ renderTimer = setTimeout(attempt, 1500); return; }   // no interrumpe mientras escribes
    render();
  };
  renderTimer = setTimeout(attempt, 300);
}
function subscribeLive(){
  if(!db) return;
  const norm = a => JSON.stringify([...a].sort((x,y)=> x.id < y.id ? -1 : 1));
  Object.keys(MODULES).forEach(key=>{
    try{
      db.collection(key).onSnapshot(snap=>{
        const rows = snap.docs.map(d => ({ id:d.id, ...d.data() }));
        touchLive();
        if(norm(rows) === norm(DATA[key])) return;
        DATA[key] = rows;
        scheduleRender();
      }, ()=>{});
    }catch(e){}
  });
}

/* ---- Piezas visuales ---- */
function ring(p, color, size){
  size = size || 64;
  const r = size/2 - 6, c = 2*Math.PI*r, v = Math.min(100, p||0), h = size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${h}" cy="${h}" r="${r}" fill="none" style="stroke:var(--border)" stroke-width="7"/>
    <circle cx="${h}" cy="${h}" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 ${h} ${h})"/>
    <text x="${h}" y="${h}" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" style="fill:var(--text)">${p===null?"—":p+"%"}</text></svg>`;
}

function metricInfo(t, metric){
  if(metric === "prospectos") return { v:String(t.pros), label:"Prospectos logrados", p:pct(t.pros,t.metaPros), sub:`Meta del plan: ${t.metaPros}`, num:t.pros };
  if(metric === "ventas")     return { v:String(t.ven),  label:"Ventas logradas",     p:pct(t.ven,t.metaVentas),  sub:`Meta del plan: ${t.metaVentas}`, num:t.ven };
  return { v:moneyShort(t.planTotal), label:"Inversión planeada", p:pct(t.presAct,t.planTotal), sub:`Ejecutado: ${moneyShort(t.presAct)}`, num:t.planTotal };
}

function brandCard(b, t, metric){
  const col = brandColor(b), m = metricInfo(t, metric);
  const focus = FILTERS.marca && sameMarca(FILTERS.marca, b), dim = FILTERS.marca && !focus;
  const hoy = isoToday();
  const urg = t.items.filter(r=>r.estado==="Urgente").length;
  const venc = t.items.filter(r=>r.fechaFin && r.fechaFin < hoy && r.estado!=="Cumplido").length;
  const empty = !t.planTotal && !t.act.length && !t.ped.length && !t.leadsN;
  return `<div class="bcard ${focus?"focus":""} ${dim?"dim":""}" style="--c:${col}" data-focus="${esc(b)}">
    <div class="top"><div><div class="name">${esc(b)}</div><div class="lbl">${m.label}</div></div>${ring(m.p, col)}</div>
    <div class="big">${m.v}</div><div class="lbl">${m.sub}</div>
    ${empty ? `<div class="mini">Sin datos en este período.</div>` : `<div class="mini">
      Plan de medios <b>${moneyShort(t.planMedios)}</b> · Merch. <b>${moneyShort(t.planMerchV)}</b><br>
      Actividades <b>${t.act.length}</b> · Prospectos <b>${t.pros}</b>/${t.metaPros} · Ventas <b>${t.ven}</b>/${t.metaVentas}</div>
      <div class="lbl" style="margin-top:8px">Merchandising ${pctTxt(t.merchAvance)}</div>
      <div class="bar-track" style="margin-top:3px"><div class="bar-fill" style="width:${t.merchAvance||0}%;background:${col}"></div></div>`}
    <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
      ${urg ? `<span class="pill" style="background:#d6454522;color:#d64545">${urg} urgente${urg>1?"s":""}</span>` : ""}
      ${venc ? `<span class="pill" style="background:#d69a3e22;color:#b9791f">${venc} vencida${venc>1?"s":""}</span>` : ""}
      <button class="btn btn-ghost" style="margin-left:auto;padding:5px 10px;font-size:12px" data-goto="gestion" data-marca="${esc(b)}">Ver gestión →</button>
    </div></div>`;
}

// Barras horizontales: cada marca puede tener varias barras, cada barra varios segmentos
function barsChart(data, fmtV){
  const tot = b => b.segs.reduce((s,x)=>s+x.v,0);
  const max = Math.max(1, ...data.flatMap(r=>r.bars.map(tot)));
  return data.map(r=>{
    const dim = FILTERS.marca && !sameMarca(FILTERS.marca, r.brand);
    return `<div class="hrow ${dim?"dim":""}" data-focus="${esc(r.brand)}">
      <div class="hlab"><i style="background:${brandColor(r.brand)}"></i>${esc(r.brand)}</div>
      <div class="hbars">${r.bars.map(b=>`<div class="hbar"><div class="htrack">${b.segs.filter(x=>x.v>0).map(x=>`<div class="hseg" style="width:${x.v/max*100}%;background:${x.color}" data-tip="${esc(x.tip)}"></div>`).join("")}</div><span class="hval">${fmtV(tot(b))}</span></div>`).join("")}</div>
    </div>`;
  }).join("");
}
const legend = items => `<div class="legend">${items.map(([c,l])=>`<span><i style="background:${c}"></i>${l}</span>`).join("")}</div>`;

function donutChart(items, fmtV, centerLabel){
  const total = items.reduce((s,x)=>s+x.value,0);
  if(!total) return `<div class="empty">Aún no hay datos para este indicador.</div>`;
  const R = 70, C = 2*Math.PI*R; let acc = 0;
  const arcs = items.filter(x=>x.value>0).map(x=>{
    const len = x.value/total*C;
    const dim = FILTERS.marca && !sameMarca(FILTERS.marca, x.label);
    const el = `<circle cx="100" cy="100" r="${R}" fill="none" stroke="${x.color}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 100 100)" style="cursor:pointer;opacity:${dim?.25:1}" data-focus="${esc(x.label)}" data-tip="${esc(x.label)}: ${esc(fmtV(x.value))} (${Math.round(x.value/total*100)}%)"></circle>`;
    acc += len; return el;
  }).join("");
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <svg width="190" height="190" viewBox="0 0 200 200">${arcs}
      <text x="100" y="94" text-anchor="middle" font-size="17" font-weight="800" style="fill:var(--text)">${esc(fmtV(total))}</text>
      <text x="100" y="114" text-anchor="middle" font-size="10.5" style="fill:var(--muted)">${esc(centerLabel)}</text></svg>
    <div style="flex:1;min-width:150px">${items.map(x=>`<div class="hrow" style="padding:4px 0" data-focus="${esc(x.label)}"><div class="hlab" style="width:auto;flex:1"><i style="background:${x.color}"></i>${esc(x.label)}</div><span class="hval" style="width:auto">${esc(fmtV(x.value))} · ${total?Math.round(x.value/total*100):0}%</span></div>`).join("")}</div>
  </div>`;
}

function entryInPeriod(f){
  if(!FILTERS.mes && !FILTERS.anio) return true;
  const d = new Date(f+"T00:00:00"); if(isNaN(d)) return true;
  if(FILTERS.mes && MESES[d.getMonth()] !== FILTERS.mes) return false;
  if(FILTERS.anio && String(d.getFullYear()) !== String(FILTERS.anio)) return false;
  return true;
}

// Evolución diaria (o acumulada) desde las bitácoras de playas, pauta y exhibiciones
function trendChart(brands){
  const per = {}, dates = new Set();
  brands.forEach(b=>{
    per[b] = {};
    statsFor(b).act.forEach(r=>(r.bitacora||[]).forEach(e=>{
      if(!e.fecha || !entryInPeriod(e.fecha)) return;
      const o = per[b][e.fecha] || (per[b][e.fecha] = { p:0, v:0 });
      o.p += Number(e.prospectos)||0; o.v += Number(e.ventas)||0; dates.add(e.fecha);
    }));
  });
  const ds = [...dates].sort();
  if(!ds.length) return `<div class="empty">Aún no hay bitácoras diarias. Cuando registres prospectos y ventas día a día (📅 en Playas, Pauta o Exhibición), la evolución aparece aquí.</div>`;
  const field = DASH.metric === "ventas" ? "v" : "p";
  const name = field === "v" ? "Ventas" : "Prospectos";
  const series = brands.map(b=>{
    let run = 0;
    return { b, pts: ds.map(d=>{ const v = (per[b][d]||{})[field] || 0; run += v; return DASH.cum ? run : v; }) };
  }).filter(s=>s.pts.some(v=>v>0));
  if(!series.length) return `<div class="empty">Sin ${name.toLowerCase()} registrados en este período.</div>`;
  const W = 640, H = 230, pl = 38, pr = 14, pt = 14, pb = 28;
  const yMax = Math.max(1, ...series.flatMap(s=>s.pts));
  const X = i => pl + (ds.length > 1 ? i/(ds.length-1) : 0.5) * (W-pl-pr);
  const Y = v => pt + (1 - v/yMax) * (H-pt-pb);
  let g = "";
  for(let k=0;k<=4;k++){
    const v = yMax*k/4, y = Y(v);
    g += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" style="stroke:var(--border)" stroke-dasharray="3 3"/><text x="${pl-6}" y="${y}" text-anchor="end" dominant-baseline="central" font-size="10" style="fill:var(--muted)">${Math.round(v)}</text>`;
  }
  const step = Math.max(1, Math.ceil(ds.length/6));
  ds.forEach((d,i)=>{ if(i%step===0 || i===ds.length-1) g += `<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="10" style="fill:var(--muted)">${fechaCorta(d)}</text>`; });
  const lines = series.map(s=>{
    const col = brandColor(s.b), dim = FILTERS.marca && !sameMarca(FILTERS.marca, s.b), foc = FILTERS.marca && !dim;
    const path = s.pts.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
    return `<g style="opacity:${dim?.2:1}"><path d="${path}" fill="none" stroke="${col}" stroke-width="${foc?3.5:2.5}" stroke-linejoin="round"/>
      ${s.pts.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="4" fill="${col}" data-tip="${esc(s.b)} · ${fechaCorta(ds[i])}: ${v} ${name.toLowerCase()}${DASH.cum?" (acumulado)":""}"></circle>`).join("")}</g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">${g}${lines}</svg>
    ${legend(series.map(s=>[brandColor(s.b), esc(s.b)]))}`;
}

// Alertas: urgentes, vencidas y merchandising por pedir
function alertsList(brand){
  const hoy = isoToday(), out = [];
  const push = (sev, b, tipo, texto, goto) => out.push({ sev, b, tipo, texto, goto });
  [["Playas","Playa de venta", r=>r.nombre||""],
   ["pauta","Pauta", r=>(r.contenido||"").slice(0,70)],
   ["exhibiciones","Exhibición CC", r=>r.centroComercial||""],
   ["planMedios","Plan de medios", r=>(r.descripcion||"").slice(0,70)]].forEach(([k,tipo,fn])=>{
    const bf = brandFieldOf(MODULES[k]);
    rowsFor(k, brand).forEach(r=>{
      if(r.estado === "Urgente") push(0, r[bf], tipo, `${fn(r)} · marcada como urgente`, k);
      else if(r.fechaFin && r.fechaFin < hoy && r.estado !== "Cumplido") push(1, r[bf], tipo, `${fn(r)} · terminó el ${r.fechaFin} y no está cumplida`, k);
    });
  });
  const pend = {};
  rowsFor("planMerch", brand).filter(r=>r.estado==="Pendiente").forEach(r=>{ pend[r.marca] = (pend[r.marca]||0) + 1; });
  Object.entries(pend).forEach(([b,n])=>push(2, b, "Merchandising", `${n} material${n>1?"es":""} pendiente${n>1?"s":""} por pedir`, "planMerch"));
  return out.sort((a,b)=>a.sev-b.sev);
}

/* =========================================================
   8. HOJA DE GESTIÓN POR MARCA
      Conecta plan de medios, plan de merchandising, playas,
      pauta, exhibiciones, pedidos y leads usando
      la marca como hilo común. Respeta el filtro de período.
   ========================================================= */
const CSV_SECTIONS = [];

function statsFor(brand){
  const R = k => rowsFor(k, brand);
  const medios = R("planMedios"), pmerch = R("planMerch"), play = R("Playas"), pau = R("pauta"), exh = R("exhibiciones");
  const ped = R("merchandising"), leads = R("leads");
  const act = [...play, ...pau, ...exh];
  let pros = 0, ven = 0;
  act.forEach(r => { const t = bitTotals(r); pros += t.prospectos; ven += t.ventas; });
  const planMedios = sumOf(medios,"valor");
  const planMerchV = pmerch.reduce((s,r)=>s+totalMerch(r),0);
  const pedTotal = sumOf(ped,"total"), pedFin = sumOf(ped,"finalizado");
  const merchAvance = pedTotal > 0 ? pct(pedFin, pedTotal)
                    : (pmerch.length ? pct(pmerch.filter(r=>r.estado==="Finalizado").length, pmerch.length) : null);
  return {
    medios, pmerch, play, pau, exh, ped, leads, act, items: [...act, ...medios],
    planMedios, planMerchV, planTotal: planMedios + planMerchV,
    metaPros: sumOf(medios,"prospectos"), metaVentas: sumOf(medios,"objetivoVentas"),
    pros, ven, presAct: sumOf(act,"presupuesto"),
    aprobado: sumOf(ped,"presupuestoAprobado"), merchAvance,
    leadsN: leads.length, leadsCerrados: leads.filter(r=>r.estado==="Cerrado").length,
  };
}

// Tabla de texto plano (se muestra en pantalla y se exporta a CSV). Si link=true, cada fila lleva a la marca.
function tbl(title, heads, rows, total, link){
  CSV_SECTIONS.push({ title, heads, rows: total ? [...rows, total] : rows });
  const th = heads.map(h=>`<th>${esc(h)}</th>`).join("");
  const td = c => `<td class="${String(c).length>40?"desc":""}">${esc(c)}</td>`;
  const trs = rows.length
    ? rows.map(r=>`<tr ${link?`class="clickrow" data-brandtab="${esc(r[0])}" title="Ver la hoja de esta marca"`:""}>${r.map(td).join("")}</tr>`).join("")
    : `<tr><td colspan="${heads.length}" class="empty">Sin registros para este filtro.</td></tr>`;
  const tr = total && rows.length ? `<tr class="total-row">${total.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>` : "";
  return `<div class="report-block"><h3>${esc(title)}</h3><div class="table-wrap"><table><thead><tr>${th}</tr></thead><tbody>${trs}${tr}</tbody></table></div></div>`;
}

function bar(label, p, color){
  return `<div class="bar-row"><div class="lab">${label}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,p||0)}%;background:${color}"></div></div><div class="num">${pctTxt(p)}</div></div>`;
}

function renderGestion(){
  CSV_SECTIONS.length = 0;

  const brands = brandsWithData();

  const tabs = [["", "Todas las marcas"], ...brands.map(b=>[b,b])].map(([v,l])=>{
    const on = v === "" ? !brand : (brand && sameMarca(v, brand));
    return `<button class="tab ${on?"on":""}" data-brandtab="${esc(v)}">${esc(l)}</button>`;
  }).join("");

  const pP = pct(s.pros, s.metaPros), pV = pct(s.ven, s.metaVentas);
  const kpis = [
    kpi("Inversión planeada", money(s.planTotal), `Medios ${money(s.planMedios)} · Merch ${money(s.planMerchV)}`),
    kpi("Presupuesto en actividades", money(s.presAct), `${s.act.length} ${s.act.length===1?"actividad":"actividades"} (playas, pauta, exhibición)`),

    kpi("Prospectos", `${s.pros} / ${s.metaPros}`, `Logrados / meta del plan · ${pctTxt(pP)}`),
    kpi("Ventas", `${s.ven} / ${s.metaVentas}`, `Logradas / meta del plan · ${pctTxt(pV)}`),
    kpi("Costo por prospecto", s.pros ? money(s.presAct/s.pros) : "—", "Presupuesto de actividades ÷ prospectos"),
    kpi("Costo por venta", s.ven ? money(s.presAct/s.ven) : "—", "Presupuesto de actividades ÷ ventas"),

    ${bar("Prospectos vs meta", pP, "#3b6bc4")}

  let detalle = "";

    const rows = brands.map(b=>{
      const t = statsFor(b);
      return [b, money(t.planMedios), money(t.planMerchV), money(t.planTotal), money(t.presAct), money(t.aprobado),
              String(t.metaPros), String(t.pros), pctTxt(pct(t.pros,t.metaPros)),
              String(t.metaVentas), String(t.ven), pctTxt(pct(t.ven,t.metaVentas)), pctTxt(t.merchAvance)];
    });
    const total = ["TOTAL", money(s.planMedios), money(s.planMerchV), money(s.planTotal), money(s.presAct), money(s.aprobado),
                   String(s.metaPros), String(s.pros), pctTxt(pP), String(s.metaVentas), String(s.ven), pctTxt(pV), pctTxt(s.merchAvance)];
    detalle = tbl(`Comparativo por marca — ${periodo}`,
      ["Marca","Plan de medios","Plan merch.","Total plan","Ppto. actividades","Merch. aprobado","Prospectos meta","Prospectos logrados","% prosp.","Ventas meta","Ventas logradas","% ventas","Avance merch."],
      rows, total, true);
  }else{
    const medios = s.medios;
    detalle += tbl(`Plan de medios — ${nombre} (${periodo})`,
      ["Actividad","Descripción","Objetivo","Prospectos","Obj. ventas","Fecha","Valor","Estado"],
      medios.map(r=>[r.actividad||"", r.descripcion||"", r.objetivo||"", String(Number(r.prospectos)||0), String(Number(r.objetivoVentas)||0), fechaLabel(r), money(r.valor), r.estado||"—"]),
      ["TOTAL","","",String(s.metaPros),String(s.metaVentas),"",money(s.planMedios),""]);
    detalle += tbl(`Plan de merchandising — ${nombre} (${periodo})`,
      ["Material P.O.P.","Descripción","Cantidad","Valor unitario","Valor total","Estado"],
      s.pmerch.map(r=>[r.material||"", r.descripcion||"", String(Number(r.cantidad)||0), money(r.valorUnitario), money(totalMerch(r)), r.estado||"—"]),
      ["TOTAL","",String(sumOf(s.pmerch,"cantidad")),"",money(s.planMerchV),""]);
    const exec = [
      ...s.play.map(r=>["Playa de venta", r.nombre||"", r]),
      ...s.pau.map(r=>["Pauta publicitaria", (r.contenido||"").slice(0,90), r]),
      ...s.exh.map(r=>["Exhibición en CC", r.centroComercial||"", r]),
    ];
    const meta = r => Number(r.metaProspectos) || Number(r.proyeccionLeads) || 0;
    detalle += tbl(`Ejecución de actividades — ${nombre} (${periodo})`,
      ["Tipo","Detalle","Fechas","Presupuesto","Meta prospectos","Prospectos logrados","Ventas logradas","Estado"],
      exec.map(([t,d,r])=>{ const b = bitTotals(r); return [t, d, fechaLabel(r), money(r.presupuesto), String(meta(r)), String(b.prospectos), String(b.ventas), r.estado||"—"]; }),
      ["TOTAL","","",money(s.presAct), String(exec.reduce((a,x)=>a+meta(x[2]),0)), String(s.pros), String(s.ven), ""]);
    detalle += tbl(`Pedidos de merchandising — ${nombre}`,
      ["Descripción","Presupuesto aprobado","Total","Pendiente","Pedido","Enviado","Finalizado","Avance"],
      s.ped.map(r=>[r.descripcion||"", money(r.presupuestoAprobado), String(Number(r.total)||0), String(Number(r.pendiente)||0), String(Number(r.pedido)||0), String(Number(r.enviado)||0), String(Number(r.finalizado)||0), pctTxt(pct(Number(r.finalizado)||0, Number(r.total)||0) ?? 0)]),
      ["TOTAL", money(s.aprobado), String(sumOf(s.ped,"total")), String(sumOf(s.ped,"pendiente")), String(sumOf(s.ped,"pedido")), String(sumOf(s.ped,"enviado")), String(sumOf(s.ped,"finalizado")), pctTxt(pct(sumOf(s.ped,"finalizado"), sumOf(s.ped,"total")))]);

    const leadChips = MODULES.leads.statusOptions.map(o=>`<span class="chip">${o}: <b>${s.leads.filter(r=>r.estado===o).length}</b></span>`).join("");
    detalle += `<div class="report-block"><h3>Comercial — ${esc(nombre)}</h3>
      <div class="chips" style="margin-bottom:0"><span class="chip"><b>Leads</b></span>${leadChips}</div>
    </div>`;
  }

  return `
    <h1>🧭 Gestión por marca</h1>
    <div class="sub">Todo lo planeado y ejecutado por marca en un solo lugar: plan de medios, plan de merchandising, playas, pauta, exhibiciones, pedidos y leads. Período: ${esc(periodo)}.</div>
    <div class="tabs">${tabs}</div>
    ${filterBar(null, { noBrand:true, period:true })}
    <div class="toolbar"><div></div>${DL ? `<button class="btn btn-ghost" data-role="export">⬇ Descargar reporte (CSV)</button>` : ""}</div>
    <div class="kpis">${kpis}</div>
    ${cumplimiento}
    ${detalle}
  `;
}

const csvCell = v => {
  let t = String(v == null ? "" : v);
  const m = t.match(/^\$ ([\d.,]+)$/);
  if(m) t = m[1].replace(/\./g,"").replace(/,/g,"");
  return /[;"\n\r]/.test(t) ? '"' + t.replace(/"/g,'""') + '"' : t;
};
async function exportGestion(){
  if(!DL){ alert("La descarga no está disponible en esta vista."); return; }
  const lines = [];
  lines.push(["Fersautos — Gestión por marca: " + (FILTERS.marca || "Todas las marcas"), [FILTERS.mes, FILTERS.anio].filter(Boolean).join(" ") || "Todos los períodos"]);
  lines.push([]);
  CSV_SECTIONS.forEach(sec => { lines.push([sec.title]); lines.push(sec.heads); sec.rows.forEach(r=>lines.push(r)); lines.push([]); });
  const csv = "\uFEFF" + lines.map(r=>r.map(csvCell).join(";")).join("\r\n");
  const file = "gestion-" + (FILTERS.marca || "todas-las-marcas").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-") + ".csv";
  try{ await DL.save({ filename:file, data:csv }); }
  catch(e){ if(!e || e.code !== "declined") alert("No se pudo descargar el archivo."); }
}

/* =========================================================
   9. REPORTES (consolida todos los módulos automáticamente)
   ========================================================= */
function renderMerchReport(mod, rows){
  const keys = mod.sumFields;
  const fieldOf = k => mod.fields.find(f=>f.key===k);
  const fmt = (k,n) => fieldOf(k).type==="currency" ? money(n) : n;
  const groups = groupsFor(mod, rows).filter(g => rows.some(r=>sameMarca(r[mod.groupByField], g)));

  const etapas = ["pendiente","pedido","enviado","finalizado"];
  const maxE = Math.max(1, ...etapas.map(k=>sumOf(rows,k)));
  const bars = etapas.map(k=>{
    const n = sumOf(rows,k);
    return `<div class="bar-row"><div class="lab">${fieldOf(k).label}</div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/maxE*100)}%;background:${MERCH_COLORS[k]}"></div></div><div class="num">${n}</div></div>`;
  }).join("");

  const trs = groups.map(g=>{
    const rs = rows.filter(r=>sameMarca(r[mod.groupByField], g));
    const tot = sumOf(rs,"total"), fin = sumOf(rs,"finalizado");
    return `<tr><td>${esc(g)}</td>${keys.map(k=>`<td>${fmt(k,sumOf(rs,k))}</td>`).join("")}<td>${tot ? Math.round(fin/tot*100) : 0}%</td></tr>`;
  }).join("");
  const totT = sumOf(rows,"total"), totF = sumOf(rows,"finalizado");
  const totalRow = `<tr class="total-row"><td>Total</td>${keys.map(k=>`<td>${fmt(k,sumOf(rows,k))}</td>`).join("")}<td>${totT ? Math.round(totF/totT*100) : 0}%</td></tr>`;

  return `<div class="report-block"><h3>${mod.icon} ${mod.label} por marca (${rows.length} en total)</h3>
    ${bars}
    ${rows.length ? `<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>Marca</th>${keys.map(k=>`<th>${fieldOf(k).label}</th>`).join("")}<th>Avance</th></tr></thead><tbody>${trs}${totalRow}</tbody></table></div>` : `<div class="empty">Aún no hay pedidos registrados.</div>`}
  </div>`;
}

function renderReportes(){
  let blocks = "";
  Object.entries(MODULES).forEach(([key, mod]) => {
    const rows = DATA[key];
    if(mod.reportType === "pedidos"){ blocks += renderMerchReport(mod, rows); return; }
    if(!mod.statusField) return;
    const max = Math.max(1, ...mod.statusOptions.map(s=>rows.filter(r=>r[mod.statusField]===s).length));
    blocks += `<div class="report-block"><h3>${mod.icon} ${mod.label} por estado (${rows.length} en total)</h3>
      ${mod.statusOptions.map(s=>{
        const c = rows.filter(r=>r[mod.statusField]===s).length;
        const p = Math.round((c/max)*100);
        return `<div class="bar-row"><div class="lab">${s}</div><div class="bar-track"><div class="bar-fill" style="width:${p}%;background:${STATUS_COLORS[s]||'#7a8496'}"></div></div><div class="num">${c}</div></div>`;
      }).join("")}
    </div>`;
  });

  const actKeys = ["Playas","pauta","exhibiciones"];
  let presupuesto = 0, prospectos = 0, ventas = 0;
  actKeys.forEach(k => (DATA[k]||[]).forEach(r => {
    presupuesto += Number(r.presupuesto)||0;
    const t = bitTotals(r); prospectos += t.prospectos; ventas += t.ventas;
  }));
  const planMediosV = sumOf(DATA.planMedios||[], "valor");
  const planMerchV = (DATA.planMerch||[]).reduce((s,r)=>s+totalMerch(r),0);
  const presupuestoMerch = sumOf(DATA.merchandising||[], "presupuestoAprobado");
  const leads = DATA.leads||[];
  const cerrados = leads.filter(r=>r.estado==="Cerrado").length;
  const conversion = leads.length ? Math.round((cerrados/leads.length)*100) : 0;

  // Desglose de presupuesto por proveedor (control de cada uno)
  const provRows = (DATA.proveedores||[]).map(p=>{
    let gasto = 0, act = 0;
    actKeys.forEach(k => (DATA[k]||[]).filter(r=>r.proveedor===p.nombre).forEach(r=>{ gasto += Number(r.presupuesto)||0; act++; }));
    return { nombre:p.nombre, tipo:p.tipo, act, gasto };
  }).filter(p=>p.act>0);
  const provBlock = provRows.length ? `
    <div class="report-block"><h3>🤝 Gasto e inversión por proveedor</h3>
      <div class="table-wrap"><table><thead><tr><th>Proveedor</th><th>Tipo</th><th>Actividades</th><th>Presupuesto asignado</th></tr></thead>
      <tbody>${provRows.map(p=>`<tr><td>${esc(p.nombre)}</td><td>${esc(p.tipo||"—")}</td><td>${p.act}</td><td>${money(p.gasto)}</td></tr>`).join("")}</tbody>
      </table></div>
    </div>` : "";

  return `
    <h1>📊 Reportes</h1>
    <div class="sub">Consolidado general (todas las marcas y períodos). Para el detalle por marca y período usa <b>Gestión por marca</b>.</div>
    <div class="kpis">
      ${kpi("Plan de medios (valor)", money(planMediosV))}
      ${kpi("Plan de merchandising (valor)", money(planMerchV))}
      ${kpi("Presupuesto total actividades", money(presupuesto))}
      ${kpi("Presupuesto merchandising aprobado", money(presupuestoMerch))}
      ${kpi("Prospectos generados", prospectos)}
      ${kpi("Ventas generadas", ventas)}
      ${kpi("Conversión de leads", conversion + "%")}
    </div>
    ${provBlock}
    ${blocks}
  `;
}

/* =========================================================
   10. ARRANQUE
   ========================================================= */
(async function start(){
  document.getElementById("content").innerHTML = '<div class="empty">Cargando información…</div>';
  await initStore();
  if(sharedMode) subscribeLive();
  READY = true;
  touchLive();
  // Tooltips de los gráficos
  const tip = document.getElementById("tip");
  document.addEventListener("mousemove", e => {
    const t = e.target.closest && e.target.closest("[data-tip]");
    if(!t){ tip.style.display = "none"; return; }
    tip.textContent = t.getAttribute("data-tip"); tip.style.display = "block";
    tip.style.left = Math.max(8, Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8)) + "px";
    tip.style.top = (e.clientY + 16) + "px";
  });
  // Esc cierra cualquier ventana abierta
  document.addEventListener("keydown", e => {
    const mr = document.getElementById("modalRoot");
    if(e.key === "Escape" && mr.innerHTML.trim() !== ""){ mr.innerHTML = ""; render(); }
  });
  render();
})();
</script>
